version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: streamlit-watermark-app
    restart: unless-stopped
    networks:
      - web-network

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
